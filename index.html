<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>重機早見表</title>
<meta name="theme-color" content="#d6246e">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="重機早見表">
</head>
<body>
<header class="bar">
  <h1>重機早見表</h1>
  <div id="tabs" class="tabs" role="group" aria-label="表示の切り替え">
    <button type="button" data-tab="juki" aria-pressed="true">重機</button>
    <button type="button" data-tab="att" aria-pressed="false">アタッチメント</button>
  </div>
  <div id="jukiBar">
  <input id="q" type="search" placeholder="機種名・番号・仕様（例: 228, ロング）" autocomplete="off">
  <div id="classes" class="chips" role="group" aria-label="クラス"></div>
  <details id="limits">
    <summary id="siteSummary">現場条件チェック</summary>
    <div class="limits">
      <label><span>通る所の幅<small>道路・門・通路</small></span><input id="pass" enterkeyhint="done" autocomplete="off" placeholder="例 2400"> mm</label>
      <label><span>高さの制限<small>ガード下・電線・梁</small></span><input id="height" enterkeyhint="done" autocomplete="off" placeholder="例 3000"> mm</label>
      <label><span>重さの制限<small>橋・スラブ・地盤</small></span><input id="mass" enterkeyhint="done" autocomplete="off" placeholder="例 8"> t</label>
      <label><span>作業場所の幅<small>その場で回れるか</small></span><input id="site" enterkeyhint="done" autocomplete="off" placeholder="例 4000"> mm</label>
      <p class="hint">キーボードのマイクで話して入れられます（「2.4メートル」も可）。△＝余裕300mm未満。重さはアタッチメントを付けない重さ。作業場所は真ん中に置いたときの目安で、壁に寄せて置く場合は見ていません。</p>
      <button id="clear" type="button">条件を消す</button>
    </div>
  </details>
  <p id="count" class="count"></p>
  </div>
  <div id="attBar" hidden>
    <input id="aq" type="search" placeholder="機種名・番号・メーカー（例: 1100）" autocomplete="off">
    <div id="aclasses" class="chips" role="group" aria-label="クラス"></div>
    <div id="akinds" class="chips" role="group" aria-label="種類"></div>
    <p id="afit" hidden></p>
    <p id="acount" class="count"></p>
  </div>
</header>

<main id="list"></main>
<main id="alist" hidden></main>

<section id="detail" hidden>
  <button id="back" type="button" class="back">← 一覧へ</button>
  <div id="detailBody"></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
