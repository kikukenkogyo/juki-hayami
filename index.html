<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>重機早見表</title>
<meta name="theme-color" content="#d6246e">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="重機早見表">
</head>
<body>
<header class="bar">
  <h1>重機早見表</h1>
  <input id="q" type="search" placeholder="機種名・番号・仕様（例: 228, ロング）" autocomplete="off">
  <div id="classes" class="chips" role="group" aria-label="クラス"></div>
  <details id="limits">
    <summary>寸法で絞る</summary>
    <div class="limits">
      <label>全幅 <input id="maxWidth" inputmode="decimal" placeholder="mm"> mm以下</label>
      <label>全高 <input id="maxHeight" inputmode="decimal" placeholder="mm"> mm以下</label>
      <label>重量 <input id="maxMass" inputmode="decimal" placeholder="t"> t以下</label>
      <button id="clear" type="button">条件を消す</button>
    </div>
  </details>
  <p id="count" class="count"></p>
</header>

<main id="list"></main>

<section id="detail" hidden>
  <button id="back" type="button" class="back">← 一覧へ</button>
  <div id="detailBody"></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
